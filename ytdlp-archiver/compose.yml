services:
  ytdlp-archiver:
    image: ghcr.io/gamerx27/ytdlp-archiver:latest
    container_name: ytdlp-archiver
    environment:
      - MAX_CONCURRENT_DOWNLOADS=2
      - PUID=1000
      - PGID=1000
      # Jellyfin (optional, required for the Monitor tab)
      #- JELLYFIN_URL=http://192.168.x.x:8096
      #- JELLYFIN_API_KEY=
      #- JELLYFIN_MEDIA_PATH=/mnt/Media
    volumes:
      - downloads_tmp:/app/tmp_downloads
      - monitors_data:/app/monitors_data
      # Must match JELLYFIN_MEDIA_PATH above
      #- /mnt/Media:/mnt/Media
    network_mode: host
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3050/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  downloads_tmp:
  monitors_data:
