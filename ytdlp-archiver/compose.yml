services:
  ytdlp-archiver:
    image: ghcr.io/gamerx27/ytdlp-archiver:latest
    container_name: ytdlp-archiver
    env_file:
      - .env
    volumes:
      - downloads_tmp:/app/tmp_downloads
      - monitors_data:/app/monitors_data
      - ${JELLYFIN_MEDIA_PATH:-/tmp/jf_noop}:${JELLYFIN_MEDIA_PATH:-/tmp/jf_noop}
    network_mode: host
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3050/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  downloads_tmp:
  monitors_data:
