server:
    # --- Networking ---
    interface: 0.0.0.0
    interface: ::0
    port: 53
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes

    # Bind as root (needed for port 53), then drop privileges.
    username: "unbound"
    directory: "/etc/unbound"
    chroot: ""
    pidfile: ""

    # --- Access control ---
    # Only private ranges + loopback are allowed to query by default. This is
    # tighter than the old setup (which allowed 0.0.0.0/0 - an open resolver
    # is a DDoS-amplification liability if it's ever reachable from the
    # internet). Add more ranges below to match your LAN if needed.
    access-control: 127.0.0.1/32 allow
    access-control: ::1/128 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow

    # --- Privacy / hardening ---
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: yes
    harden-algo-downgrade: yes
    use-caps-for-id: yes
    qname-minimisation: yes
    aggressive-nsec: yes

    # --- DNSSEC ---
    # Bootstrapped by entrypoint.sh (unbound-anchor) into this same, persistent
    # volume; unbound keeps it current itself via RFC 5011 afterwards.
    auto-trust-anchor-file: "/etc/unbound/root.key"

    # --- Performance / caching ---
    num-threads: 2
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    cache-min-ttl: 0
    cache-max-ttl: 86400
    msg-cache-size: 64m
    rrset-cache-size: 128m
    so-reuseport: yes

    # --- Extended DNS errors (RFC 8914) ---
    ede: yes
    ede-serve-expired: yes

    # --- Logging: to stdout, so `docker logs` captures it ---
    logfile: ""
    use-syslog: no
    verbosity: 1
    log-queries: no

# Drop any host-specific overrides (extra domains, local-zone records, etc.)
# in ./config/unbound.conf.d/*.conf - they get picked up without touching this file.
include: "/etc/unbound/unbound.conf.d/*.conf"
