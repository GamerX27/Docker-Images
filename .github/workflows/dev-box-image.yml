name: Build Dev-Box image

on:
  push:
    branches: [main]
    paths:
      - "Dev-Box/**"
      - ".github/workflows/dev-box-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: Dev-Box
          push: true
          no-cache: true
          platforms: linux/amd64
          tags: ghcr.io/gamerx27/dev-box:latest
