name: Build ytdlp-archiver image

on:
  push:
    branches: [main]
    paths:
      - "ytdlp-archiver/**"
      - ".github/workflows/ytdlp-archiver-image.yml"
  schedule:
    # Source lives in a separate repo (canonical on Codeberg, mirrored to
    # GamerX27/X-YT-DLP-Archiver on GitHub), so a push there never triggers
    # this workflow. Rebuild daily instead to pick up new source commits,
    # yt-dlp releases, and base-image security patches.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout X-YT-DLP-Archiver source (mirrored from Codeberg)
        uses: actions/checkout@v4
        with:
          repository: GamerX27/X-YT-DLP-Archiver
          path: source

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: source
          file: source/docker/Dockerfile
          push: true
          no-cache: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/gamerx27/ytdlp-archiver:latest
