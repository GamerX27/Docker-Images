name: Build ytdlp-archiver image

on:
  push:
    branches: [main]
    paths:
      - "ytdlp-archiver/**"
      - ".github/workflows/ytdlp-archiver-image.yml"
  schedule:
    # Source lives on Codeberg (see ytdlp-archiver/README.md), so a push
    # there never triggers this workflow — rebuild daily instead to pick up
    # new source commits, yt-dlp releases, and base-image security patches.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone X-YT-DLP-Archiver source (hosted on Codeberg, not mirrored here)
        run: git clone --depth=1 https://codeberg.org/X27/X-YT-DLP-Archiver.git source

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: source
          file: source/docker/Dockerfile
          push: true
          no-cache: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/gamerx27/ytdlp-archiver:latest
