name: Build unbound image

on:
  push:
    branches: [main]
    paths:
      - "unbound/**"
      - ".github/workflows/unbound-image.yml"
  schedule:
    # Weekly rebuild so Alpine security patches for unbound land automatically.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # ghcr.io/gamerx27/unbound is still linked to the old Docker-X27-Composes
      # repo, so the default GITHUB_TOKEN here doesn't have write_package on
      # it. PUBLISH is a classic PAT (write:packages) added as a repo secret.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PUBLISH }}

      - uses: docker/build-push-action@v6
        with:
          context: unbound
          push: true
          no-cache: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/gamerx27/unbound:latest
