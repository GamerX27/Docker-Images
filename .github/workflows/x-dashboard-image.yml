name: Build X-Dashboard image

on:
  push:
    branches: [main]
    paths:
      - "X-Dashboard/**"
      - ".github/workflows/x-dashboard-image.yml"
  schedule:
    # Weekly rebuild to pick up the selfh.st/icons set and base-image
    # security patches without a code change.
    - cron: "0 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: X-Dashboard
          push: true
          no-cache: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/gamerx27/x-dashboard:latest
